<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate standard-notation to string-and-fret reference diagrams for fretted instruments.">
  <title>Clawford</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#20231f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clawford">
  <link rel="icon" type="image/png" sizes="32x32" href="img/clawford-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/clawford-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/clawford-180.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="site-header">
    <button id="fun-fact-image" class="site-logo-button" type="button" aria-label="Show a random Clawford fact" disabled>
      <img class="site-logo" src="img/clawford-112.png" alt="Clawford, a banjo-playing ferret" width="112" height="112">
    </button>
    <div id="fun-fact-preview" class="fun-fact-preview" hidden aria-hidden="true">
      <img alt="">
    </div>
    <div>
      <p class="eyebrow">Fretted-instrument toolbox</p>
      <h1>Clawford</h1>
      <p id="warning-banner" class="warning-banner" role="alert">⚠ Built entirely by AI. Trust it like you'd trust a ferret walking on your keyboard.</p>
    </div>
  </header>

  <main class="app-shell">
    <aside class="settings-panel" aria-label="Settings">
      <form id="settings-form">
        <div class="control-grid">
          <fieldset class="segmented full-control">
            <legend>View</legend>
            <label><input type="radio" name="view" value="notation"> Notation</label>
            <label><input type="radio" name="view" value="fretboard"> Fretboard</label>
            <label><input type="radio" name="view" value="tuner"> Tuner</label>
            <label><input type="radio" name="view" value="metronome"> Metronome</label>
          </fieldset>
          <div id="general-controls" class="general-controls">
            <label id="instrument-control">Instrument<select id="instrument" name="instrument"></select></label>
            <label id="tuning-control">Tuning<select id="tuning" name="tuning"></select></label>
            <label id="key-control">Key<select id="key" name="key"></select></label>
            <label id="scale-control">Scale<select id="scale" name="scale"></select></label>
          </div>
          <label id="chord-root-control">Root<select id="chord-root" name="chordRoot"></select></label>
          <label id="chord-quality-control">Chord / Scale<select id="chord-quality" name="chordQuality"></select></label>
          <fieldset id="tuner-controls" class="tuner-controls full-control" hidden>
            <legend>Tuner mode</legend>
            <label><input type="radio" name="tunerMode" value="tuning"> Strings</label>
            <label><input type="radio" name="tunerMode" value="chromatic"> Chromatic</label>
            <label class="tuner-device-control">Input<select id="tuner-input-device"><option value="">Default microphone</option></select></label>
            <label class="tuner-a4-control" for="tuner-a4">A4 calibration (Hz)<input id="tuner-a4" name="tunerA4" type="number" min="400" max="480" step="1" inputmode="decimal" required></label>
            <div class="tuner-actions">
              <button id="tuner-start" type="button">Start microphone</button>
            <button id="tuner-stop" type="button" disabled>Stop</button>
            </div>
          </fieldset>
          <fieldset id="metronome-controls" class="metronome-controls full-control" hidden>
            <legend>Metronome</legend>
            <label>BPM<input id="metronome-bpm" name="metronomeBpm" type="number" min="30" max="300" step="1" inputmode="numeric" required></label>
            <label>Beats per measure<input id="metronome-numerator" name="metronomeNumerator" type="number" min="1" max="12" step="1" inputmode="numeric" required></label>
            <label>Beat value<select id="metronome-denominator" name="metronomeDenominator"><option value="2">Half note</option><option value="4">Quarter note</option><option value="8">Eighth note</option><option value="16">Sixteenth note</option></select></label>
            <label><input type="checkbox" name="metronomeFirstAccent"> Accent first beat</label>
            <label><input type="checkbox" name="metronomeOddAccent"> Accent odd beats</label>
          </fieldset>
        </div>
      </form>
    </aside>


    <section class="output-panel" aria-label="Generated fretted-instrument diagram">
      <div id="notation-output" class="diagram-frame"></div>
      <div id="fretboard-output" class="diagram-frame"></div>
      <div id="tuner-output" class="tuner-output" hidden></div>
      <div id="metronome-output" class="metronome-output" hidden></div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.error("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
