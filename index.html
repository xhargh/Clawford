<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate standard-notation to string-and-fret reference diagrams for fretted instruments.">
  <title>FretMap</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">Fretted-instrument reference builder</p>
      <h1>FretMap</h1>
      <p class="warning-banner" role="alert">⚠ Untested: this tool has not been verified against real instruments. Double-check every note before relying on it.</p>
    </div>
  </header>

  <main class="app-shell">
    <aside class="settings-panel" aria-labelledby="settings-title">
      <div class="panel-heading">
        <h2 id="settings-title">Settings</h2>
      </div>
      <form id="settings-form">
        <div class="control-grid">
          <fieldset class="segmented full-control">
            <legend>View</legend>
            <label><input type="radio" name="view" value="notation"> Notation</label>
            <label><input type="radio" name="view" value="fretboard"> Fretboard</label>
          </fieldset>
          <label>Instrument<select id="instrument" name="instrument"></select></label>
          <label>Tuning<select id="tuning" name="tuning"></select></label>
          <label id="key-control">Key<select id="key" name="key"></select></label>
          <label id="scale-control">Scale<select id="scale" name="scale"></select></label>
          <label id="chord-root-control">Root<select id="chord-root" name="chordRoot"></select></label>
          <label id="chord-quality-control">Chord<select id="chord-quality" name="chordQuality"></select></label>
          <fieldset class="segmented full-control" id="orientation-control">
            <legend>Orientation</legend>
            <label><input type="radio" name="fretboardOrientation" value="vertical"> Vertical (pegboard up)</label>
            <label><input type="radio" name="fretboardOrientation" value="horizontal"> Horizontal</label>
          </fieldset>
        </div>
      </form>
    </aside>


    <section class="output-panel" aria-label="Generated fretted-instrument diagram">
      <div id="notation-output" class="diagram-frame"></div>
      <div id="fretboard-output" class="diagram-frame"></div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
