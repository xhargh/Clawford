<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate standard-notation to string-and-fret reference diagrams for fretted instruments.">
  <title>Clawford</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#20231f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clawford">
  <link rel="icon" type="image/png" sizes="32x32" href="img/clawford-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/clawford-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/clawford-180.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <header class="site-header">
    <button id="fun-fact-image" class="site-logo-button" type="button" aria-label="Show a random Clawford fact" disabled>
      <img class="site-logo" src="img/clawford-112.png" alt="Clawford, a banjo-playing ferret" width="112" height="112">
    </button>
    <div id="fun-fact-preview" class="fun-fact-preview" hidden aria-hidden="true">
      <img alt="">
    </div>
    <div class="brand-copy">
      <h1>Clawford</h1>
      <p id="warning-banner" class="warning-banner" role="status">⚠ Built entirely by AI. Trust it like you'd trust a ferret walking on your keyboard.</p>
    </div>
    <a class="story-link" href="backstory.html">Meet Clawford <span aria-hidden="true">↗</span></a>
  </header>

  <main class="app-shell">
    <fieldset id="tool-navigation" class="segmented tool-navigation">
      <legend class="visually-hidden">Choose a tool</legend>
      <label><input type="radio" name="view" value="notation" form="settings-form"><span aria-hidden="true" class="tool-number">01</span> Notation</label>
      <label><input type="radio" name="view" value="fretboard" form="settings-form"><span aria-hidden="true" class="tool-number">02</span> Fretboard</label>
      <label><input type="radio" name="view" value="tuner" form="settings-form"><span aria-hidden="true" class="tool-number">03</span> Tuner</label>
      <label><input type="radio" name="view" value="metronome" form="settings-form"><span aria-hidden="true" class="tool-number">04</span> Metronome</label>
     <label><input type="radio" name="view" value="ear-training" form="settings-form"><span aria-hidden="true" class="tool-number">05</span> Ear training</label>
     <label><input type="radio" name="view" value="play-along" form="settings-form"><span aria-hidden="true" class="tool-number">06</span> Play along</label>
    </fieldset>
    <aside class="settings-panel" aria-label="Settings">
      <div class="panel-heading"><h2>Your setup</h2></div>
      <form id="settings-form">
        <div class="control-grid">
          <div id="general-controls" class="general-controls">
            <label id="instrument-control">Instrument<select id="instrument" name="instrument"></select></label>
            <label id="tuning-control">Tuning<select id="tuning" name="tuning"></select></label>
            <label id="key-control">Key<select id="key" name="key"></select></label>
            <label id="scale-control">Scale<select id="scale" name="scale"></select></label>
          </div>
          <label id="chord-root-control">Root<select id="chord-root" name="chordRoot"></select></label>
           <label id="chord-quality-control">Chord / Scale<select id="chord-quality" name="chordQuality"></select></label>
           <fieldset id="fretboard-mode-control" class="full-control" hidden>
             <legend>Fretboard view</legend>
             <label><input type="radio" name="fretboardMode" value="tones"> All chord tones</label>
             <label><input type="radio" name="fretboardMode" value="shape"> Chord shape</label>
             <label id="fretboard-shape-select-control" hidden>Voicing<select id="fretboard-shape-select"></select></label>
           </fieldset>
          <fieldset id="tuner-controls" class="tuner-controls full-control" hidden>
            <legend>Tuner mode</legend>
            <label><input type="radio" name="tunerMode" value="tuning"> Strings</label>
            <label><input type="radio" name="tunerMode" value="chromatic"> Chromatic</label>
            <label class="tuner-device-control">Input<select id="tuner-input-device"><option value="">Default microphone</option></select></label>
            <label class="tuner-a4-control" for="tuner-a4">A4 calibration (Hz)<input id="tuner-a4" name="tunerA4" type="number" min="400" max="480" step="1" inputmode="decimal" required></label>
            <div class="tuner-actions">
              <button id="tuner-start" type="button">Start microphone</button>
            <button id="tuner-stop" type="button" disabled>Stop</button>
            </div>
          </fieldset>
          <fieldset id="metronome-controls" class="metronome-controls full-control" hidden>
            <legend>Metronome</legend>
            <label for="metronome-tpm">Ticks per minute <output id="metronome-tpm-value" for="metronome-tpm">96</output><input id="metronome-tpm" name="metronomeTpm" type="range" min="30" max="360" step="1" required></label>
            <label for="metronome-ticks">Ticks per cycle <output id="metronome-ticks-value" for="metronome-ticks">4</output><input id="metronome-ticks" name="metronomeTicks" type="range" min="1" max="16" step="1" required></label>
          </fieldset>
         <fieldset id="ear-training-controls" class="ear-training-controls full-control" hidden>
            <legend>Ear training</legend>
            <label>Exercise<select id="ear-exercise" name="earExercise">
              <option value="find">Find: one note at a time</option>
              <option value="follow">Follow: nearby same-string movement</option>
              <option value="simon">Simon: remember the sequence</option>
            </select></label>
            <label>Note generation<select id="ear-variant" name="earVariant">
              <option value="open-string">Open strings: find the string</option>
              <option value="free">Low-position notes</option>
              <option value="scale">Notes in current key and scale</option>
              <option value="rolling">Rolling Simon sequence</option>
            </select></label>
            <label id="ear-sequence-limit-control">Rolling memory length<input id="ear-sequence-limit" name="earSequenceLimit" type="number" min="1" max="32" step="1" inputmode="numeric"></label>
         </fieldset>
         <fieldset id="play-along-controls" class="play-along-controls full-control" hidden>
           <legend>Chord + pattern</legend>
           <label>Progression<select id="play-along-progression"><option value="one-four-one-five7">I–IV–I–V7: C–F–C–G7</option><option value="one-six-four-five">I–vi–IV–V: C–Am–F–G</option><option value="one-four-five-one">I–IV–V–I: C–F–G–C</option><option value="pop-four-chord">I–V–vi–IV: C–G–Am–F</option></select></label>
            <label>Pattern<select id="play-along-pattern"></select></label>
            <label id="play-along-technique-control" hidden>Technique<select id="play-along-technique"><option value="clawhammer">Clawhammer</option><option value="three-finger">Three-finger</option></select></label>
            <label id="play-along-meter-control" hidden>Custom meter<select id="play-along-meter"><option value="2/4">2/4</option><option value="3/4">3/4</option><option value="4/4" selected>4/4</option><option value="6/8">6/8</option><option value="12/8">12/8</option></select></label>
           <label for="play-along-bpm">BPM <output id="play-along-bpm-value">90</output><input id="play-along-bpm" type="range" min="40" max="220" step="1" value="90"></label>
         </fieldset>
        </div>
      </form>
    </aside>


    <section id="workspace" class="output-panel" aria-labelledby="workspace-title" tabindex="-1">
      <div class="workspace-heading"><h2 id="workspace-title">Notation</h2></div>
      <p id="workspace-hint" class="workspace-hint">Select a note to hear it. Explore where it lives on each string.</p>
      <div id="notation-output" class="diagram-frame"></div>
      <div id="fretboard-output" class="diagram-frame"></div>
      <div id="tuner-output" class="tuner-output" hidden></div>
      <div id="metronome-output" class="metronome-output" hidden></div>
      <div id="ear-training-output" class="ear-training-output" hidden></div>
       <div id="ear-training-fretboard-output" class="ear-training-fretboard-output" hidden></div>
       <div id="play-along-output" class="play-along-output" hidden></div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.error("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
