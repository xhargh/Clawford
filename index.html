<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate standard-notation to string-and-fret reference diagrams for five-string banjo.">
  <title>Banjo Note Map</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">5-string reference builder</p>
      <h1>Banjo Note Map</h1>
    </div>
    <p class="header-copy">Translate written notes into every playable string and fret position.</p>
  </header>

  <main class="app-shell">
    <aside class="settings-panel" aria-labelledby="settings-title">
      <div class="panel-heading">
        <h2 id="settings-title">Settings</h2>
        <span class="live-mark" aria-hidden="true">Live</span>
      </div>
      <form id="settings-form">
        <div class="control-grid">
          <label>Tuning<select id="tuning" name="tuning"></select></label>
          <label>Key<select id="key" name="key"></select></label>
          <label>Scale<select id="scale" name="scale"></select></label>
          <fieldset class="segmented full-control">
            <legend>View</legend>
            <label><input type="radio" name="view" value="notation"> Notation</label>
            <label><input type="radio" name="view" value="fretboard"> Fretboard</label>
            <label><input type="radio" name="view" value="both"> Both</label>
          </fieldset>
        </div>
      </form>
    </aside>

    <section class="output-panel" aria-labelledby="output-title">
      <div class="output-heading no-print">
        <div><p class="eyebrow">Generated reference</p><h2 id="output-title">Your diagram</h2></div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="notation-output" class="diagram-frame"></div>
      <div id="fretboard-output" class="diagram-frame"></div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
